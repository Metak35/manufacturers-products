spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:migration/001_init.sql
spring.jpa.show-sql=false
