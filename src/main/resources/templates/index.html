<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Производители и товары</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header :: nav}"></div><main><h1>Производители и товары</h1><h2>Производители</h2><a href="/manufacturers/new">Добавить производителя</a><table><tr><th>ID</th><th>Название</th><th>Страна</th></tr><tr th:each="m : ${manufacturers}"><td th:text="${m.id}"></td><td><a th:href="@{/manufacturers/{id}(id=${m.id})}" th:text="${m.name}"></a></td><td th:text="${m.country}"></td></tr></table><h2>Товары</h2><a href="/products/new">Добавить товар</a><table><tr><th>ID</th><th>Название</th><th>Цена</th><th>Производитель</th></tr><tr th:each="p : ${products}"><td th:text="${p.id}"></td><td><a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}"></a></td><td th:text="${p.price}"></td><td th:text="${p.manufacturer.name}"></td></tr></table><h2>CRUD через JavaScript и API</h2><p>Формы ниже отправляют запросы на сервер без перезагрузки страницы.</p><section><h3>Производители — API</h3><form id="api-form"><input type="hidden" id="api-id"><input id="api-name" placeholder="Название" required><input id="api-country" placeholder="Страна"><button>Сохранить</button><button type="button" id="api-reset">Очистить</button></form><p id="api-status" role="status"></p><table><thead><tr><th>ID</th><th>Название</th><th>Страна</th><th>Действия</th></tr></thead><tbody id="api-rows"></tbody></table></section></main><script src="/js/manufacturers.js"></script></body></html>
