<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Форма товара</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header :: nav}"></div><main><h1>Товар</h1><form th:action="@{/products/save}" th:object="${product}" method="post"><input type="hidden" th:field="*{id}"><label>Название<input th:field="*{name}" required></label><label>Цена<input type="number" min="0" step="0.01" th:field="*{price}" required></label><label>Производитель<select name="manufacturerId" required><option th:each="m:${manufacturers}" th:value="${m.id}" th:text="${m.name}" th:selected="${product.manufacturer != null and product.manufacturer.id == m.id}"></option></select></label><button>Сохранить</button></form></main></body></html>
