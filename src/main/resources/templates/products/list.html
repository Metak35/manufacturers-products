<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Товары</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header :: nav}"></div><main><h1>Товары</h1><a href="/products/new">Добавить товар</a><table><tr><th>Название</th><th>Цена</th><th>Производитель</th><th>Действия</th></tr><tr th:each="p:${products}"><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.manufacturer.name}"></td><td><a th:href="@{/products/{id}(id=${p.id})}">Просмотр</a> <a th:href="@{/products/{id}/edit(id=${p.id})}">Изменить</a><form th:action="@{/products/{id}/delete(id=${p.id})}" method="post"><button>Удалить</button></form></td></tr></table></main></body></html>
