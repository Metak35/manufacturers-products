<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Производители</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header :: nav}"></div><main><h1>Производители</h1><a href="/manufacturers/new">Добавить</a><table><tr><th>ID</th><th>Название</th><th>Страна</th><th>Действия</th></tr><tr th:each="m:${manufacturers}"><td th:text="${m.id}"></td><td th:text="${m.name}"></td><td th:text="${m.country}"></td><td><a th:href="@{/manufacturers/{id}(id=${m.id})}">Просмотр</a> <a th:href="@{/manufacturers/{id}/edit(id=${m.id})}">Изменить</a><form th:action="@{/manufacturers/{id}/delete(id=${m.id})}" method="post" onsubmit="return confirm('Удалить производителя?')"><button>Удалить</button></form></td></tr></table><p>Производителя с товарами нельзя удалить, пока товары не удалены или не переназначены.</p></main></body></html>
